<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - iam des!gns</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #f26522;
            --dark: #232323;
            --gray: #666666;
            --light-gray: #f4f4f4;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: var(--light-gray); 
            color: var(--dark); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-image: radial-gradient(circle at top right, rgba(242, 101, 34, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(242, 101, 34, 0.05), transparent 40%);
        }

        .login-container {
            background: var(--white);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid var(--primary);
            text-align: center;
        }

        .login-header { margin-bottom: 30px; }
        .login-header img { height: 60px; margin-bottom: 15px; border-radius: 8px; }
        .login-header h2 { font-size: 24px; font-weight: 700; color: var(--dark); }
        .login-header p { font-size: 14px; color: var(--gray); margin-top: 5px; }

        .form-group { margin-bottom: 20px; text-align: left; position: relative;}
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 8px; }
        
        .form-group input {
            width: 100%; padding: 15px; border: 1px solid #eaeaea; 
            border-radius: 8px; font-family: inherit; font-size: 14px;
            background: var(--light-gray); transition: all 0.3s ease;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); background: var(--white); }
        .form-group input:read-only { background: #e9ecef; color: #6c757d; cursor: not-allowed; }

        .btn-submit {
            background: var(--primary); color: var(--white); border: none; 
            padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 700; 
            cursor: pointer; width: 100%; transition: 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover:not(:disabled) { background: #d9561a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(242, 101, 34, 0.3); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        .error-message {
            color: #dc3545; background: #ffe6e6; padding: 10px; border-radius: 8px;
            font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none;
        }
        
        .success-message {
            color: #28a745; background: #d4edda; padding: 10px; border-radius: 8px;
            font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none;
        }

        #otp-group { display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <img src="LOGO.jpg.jpeg" alt="iam designs logo" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
            <h2>Admin Login</h2>
            <p id="instruction-text">Enter your email to receive a One-Time Password.</p>
        </div>

        <div id="error-box" class="error-message"></div>
        <div id="success-box" class="success-message"></div>

        <form id="login-form">
            <div class="form-group" id="email-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="iamdesign81@gmail.com" required autocomplete="email">
            </div>

            <div class="form-group" id="otp-group">
                <label for="otp">One-Time Password (OTP)</label>
                <input type="text" id="otp" placeholder="Enter 6-digit code" autocomplete="one-time-code">
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Send OTP</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://wrqkrpysvhtjenxyytfp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-DXwYtZ4x8XSt1DV_sQc-w_wA7Ir0N_';

        let supabaseClient = null;
        if(SUPABASE_URL.startsWith('http')) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            checkActiveSession();
        }

        async function checkActiveSession() {

        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');
        const emailInput = document.getElementById('email');
        const otpInput = document.getElementById('otp');
        const otpGroup = document.getElementById('otp-group');
        const instructionText = document.getElementById('instruction-text');

        let isOtpSent = false;
        let currentUserEmail = "";

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            if (!supabaseClient) {
                showError("Supabase is not configured properly.");
                return;
            }

            if (!isOtpSent) {
                const email = emailInput.value.trim();
                submitBtn.innerText = "Sending Code...";
                submitBtn.disabled = true;

                try {
                    const { data, error } = await supabaseClient.auth.signInWithOtp({
                        email: email,
                        options: { shouldCreateUser: false }
                    });

                    if (error) throw error;

                    isOtpSent = true;
                    currentUserEmail = email;
                    
                    emailInput.readOnly = true;
                    otpGroup.style.display = 'block';
                    otpInput.setAttribute("required", "true");
                    
                    instructionText.innerText = "Check your inbox and enter the 6-digit code.";
                    submitBtn.innerText = "Verify & Sign In";
                    submitBtn.disabled = false;
                    
                    successBox.innerText = "OTP sent successfully!";
                    successBox.style.display = 'block';

                } catch (error) {
                    showError(error.message);
                    submitBtn.innerText = "Send OTP";
                    submitBtn.disabled = false;
                }
            } else {
                const token = otpInput.value.trim();
                submitBtn.innerText = "Verifying...";
                submitBtn.disabled = true;

                try {
                    const { data: { session }, error } = await supabaseClient.auth.verifyOtp({
    email: currentUserEmail,
    token: token,
    type: 'email'
});

if (error) throw error;

window.location.href = 'dashboard.html'; // <-- MUST BE EXACTLY THIS
                    if (error) throw error;

                    window.location.href = 'dashboard.html'; 
                } catch (error) {
                    showError(error.message);
                    submitBtn.innerText = "Verify & Sign In";
                    submitBtn.disabled = false;
                }
            }
        });

        function showError(message) {
            errorBox.innerText = message;
            errorBox.style.display = 'block';
            successBox.style.display = 'none';
        }
    </script>
</body>
</html>
