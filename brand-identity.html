<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Identity - Mahima Nethralaya</title>

    <link rel="icon" href="LOGO.jpg.jpeg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <style>
        /* ===========================================================
           BRAND FONTS
           =========================================================== */
        @font-face { font-family: 'Graphie'; src: local('Graphie'), local('Graphie-Regular'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Graphie'; src: local('Graphie SemiBold'), local('Graphie-SemiBold'); font-weight: 600; font-display: swap; }
        @font-face { font-family: 'Graphie'; src: local('Graphie Bold'), local('Graphie-Bold'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Graphie'; src: local('Graphie ExtraBold'), local('Graphie-ExtraBold'); font-weight: 800; font-display: swap; }
        @font-face { font-family: 'Keep Calm'; src: local('KeepCalm-Medium'), local('Keep Calm Medium'), local('KeepCalm'); font-weight: 500; font-display: swap; }
        @font-face { font-family: 'Keep Calm'; src: local('KeepCalm-Bold'), local('Keep Calm Bold'); font-weight: 700; font-display: swap; }

        :root {
            /* Mahima Nethralaya EXACT Brand Palette */
            --brand-cyan: #00ABC2;
            --brand-amber: #E98024;
            --brand-grey: #505050;

            /* Presentation Board Environments */
            --bg-dark-teal: #014A5A;
            --bg-dark-orange: #C7671B;
            --bg-hero: #8396a8;

            /* Premium Studio Theme */
            --bg-studio: #f4f4f2;
            --bg-paper: #ecece8;
            --bg-panel: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-main: #1a1a1a;
            --text-muted: #666666;

            /* Type roles */
            --font-brand: 'Graphie', 'Keep Calm', 'Poppins', 'Montserrat', sans-serif;
            --font-body: 'Keep Calm', 'Graphie', 'Poppins', 'Montserrat', sans-serif;

            --shadow-soft: 0 20px 40px rgba(0,0,0,0.04);
            --shadow-lift: 0 30px 60px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);

            --ease-cinematic: cubic-bezier(0.25, 1, 0.35, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; background: var(--bg-studio); }
        body { color: var(--text-main); font-family: var(--font-brand); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

        ::selection { background: var(--brand-cyan); color: #fff; }

        /* Custom Cursor */
        @media (pointer: fine) {
            .cursor { position: fixed; top: 0; left: 0; width: 12px; height: 12px; background: var(--brand-amber); border-radius: 50%; pointer-events: none; z-index: 9000; transform: translate(-50%, -50%); transition: width .3s var(--ease-cinematic), height .3s var(--ease-cinematic), background .3s; opacity: 0; }
            .cursor.on { opacity: 1; }
            .cursor.grow { width: 40px; height: 40px; background: rgba(233, 128, 36, 0.1); border: 1px solid var(--brand-amber); }
        }

        /* Navigation */
        .top-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 950; padding: clamp(10px, 2vw, 20px) 5%; background: rgba(244, 244, 242, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: clamp(11px, 2vw, 13px); text-transform: uppercase; letter-spacing: 1.5px; transition: color .3s, transform .3s var(--ease-cinematic); }
        .back-btn:hover, .back-btn:focus-visible { color: var(--text-main); transform: translateX(-4px); }
        .nav-logo { width: clamp(32px, 5vw, 40px); height: clamp(32px, 5vw, 40px); border-radius: 8px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* ================= SCROLLYTELLING ================= */
        .scroll-container { position: relative; display: flex; width: 100%; margin-top: 80px; }

        .visual-panel { position: sticky; top: 80px; width: 55%; height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; overflow: hidden; background: #ffffff; z-index: 1; border-left: 1px solid var(--glass-border); perspective: 1200px; box-shadow: inset 20px 0 40px rgba(0,0,0,0.01); }

        .paper-texture { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s var(--ease-cinematic); pointer-events: none;
            background-color: var(--bg-paper);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"); }

        .print-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: clamp(12px, 4vw, 24px); background: #ffffff; z-index: 3;
            opacity: 0; visibility: hidden; transform: scale(1.05);
            transition: opacity 1.1s var(--ease-cinematic), transform 1.5s var(--ease-cinematic), visibility 0s linear 1.1s; }
        .print-frame { position: relative; width: 100%; max-width: 100%; max-height: 100%; aspect-ratio: 3740 / 3220; margin: auto; }
        .print-photo { display: block; width: 100%; height: 100%; object-fit: contain; }
        
        .card-logo { position: absolute; left: 18.59%; top: 21.85%; width: 19.94%; height: auto;
            transform: translate(-50%, -50%) rotate(5.53deg); transform-origin: center center;
            mix-blend-mode: multiply; opacity: 0.97; }
        .card-logo .o-shape { fill: var(--brand-amber); }
        .card-logo .t-shape { fill: var(--brand-cyan); }
        .card-logo .pupil { fill: var(--brand-grey); }
        .card-logo .brand-text { fill: var(--brand-cyan); font-family: var(--font-brand); font-weight: 700; letter-spacing: -1.5px; }

        .text-panel { width: 45%; position: relative; z-index: 2; padding: 0 5%; }
        .step-block { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 50px 0; }

        .step-card { background: var(--bg-panel); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: clamp(30px, 5vw, 55px) clamp(25px, 4vw, 45px); border-radius: 24px; box-shadow: var(--shadow-soft); border: 1px solid rgba(255,255,255,0.6); opacity: 0.3; transform: translateY(40px); transition: opacity .8s var(--ease-spring), transform .8s var(--ease-spring), box-shadow .8s var(--ease-spring); position: relative; }
        .step-block.is-active .step-card { opacity: 1; transform: translateY(0); box-shadow: var(--shadow-lift); }

        .step-tag { font-family: 'Playfair Display', serif; font-size: clamp(14px, 2vw, 16px); font-style: italic; color: var(--brand-cyan); margin-bottom: 20px; display: inline-block; }
        .step-card h2 { font-size: clamp(26px, 3.5vw, 44px); font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-bottom: 20px; color: var(--text-main); }
        .step-card p { color: var(--text-muted); font-family: var(--font-body); font-size: clamp(15px, 2vw, 16px); line-height: 1.8; font-weight: 400; }

        .stage-center { transition: transform 1.5s var(--ease-cinematic), opacity .8s var(--ease-cinematic); position: relative; width: 100%; max-width: 540px; aspect-ratio: 540 / 456; transform-style: preserve-3d; z-index: 2; margin: 0 auto;}

        .logo-layer { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 1.2s var(--ease-cinematic), opacity 1.2s var(--ease-cinematic), filter 1.2s var(--ease-cinematic); overflow: visible; }

        .shape-path, .shape-dot, .pupil, .brand-text { transition: fill 1.2s var(--ease-cinematic), stroke 1.2s var(--ease-cinematic), stroke-width 1.2s var(--ease-cinematic), opacity 1.2s var(--ease-cinematic); stroke-linejoin: round; stroke-linecap: round; }
        .brand-text { font-family: var(--font-brand); font-weight: 700; letter-spacing: -1.5px; }
        .logo-nodes circle { transition: opacity .6s var(--ease-spring); opacity: 0; }

        @keyframes pencilDraw { 0% { stroke-dashoffset: 2600; } 100% { stroke-dashoffset: 0; } }

        /* ---------- SCROLL STATES (DESKTOP) ---------- */
        [data-state="1"] .paper-texture { opacity: 1; }
        [data-state="1"] .stage-center { transform: scale(0.9) rotate(-2deg); }
        [data-state="1"] .shape-path, [data-state="1"] .shape-dot, [data-state="1"] .pupil, [data-state="1"] .brand-text {
            stroke: #444444; stroke-width: 4; fill: transparent; stroke-dasharray: 2600; stroke-dashoffset: 0; animation: pencilDraw 3s forwards var(--ease-cinematic);
            filter: url(#pencil-texture);
        }

        [data-state="2"] .stage-center { transform: scale(1) rotate(0deg); }
        [data-state="2"] .shape-path, [data-state="2"] .shape-dot, [data-state="2"] .pupil, [data-state="2"] .brand-text {
            stroke: #007aff; stroke-width: 2.5; fill: rgba(0, 122, 255, 0.03); stroke-dasharray: none; filter: none;
        }
        [data-state="2"] .logo-nodes circle { opacity: 1; fill: #ffffff; stroke: #007aff; stroke-width: 2.5; }

        [data-state="3"] .stage-center { transform: scale(1.02); filter: drop-shadow(0 20px 40px rgba(0,0,0,0.06)); }
        [data-state="3"] .o-shape { fill: var(--brand-amber); stroke: transparent; }
        [data-state="3"] .t-shape { fill: var(--brand-cyan); stroke: transparent; }
        [data-state="3"] .pupil { fill: var(--brand-grey); stroke: transparent; }
        [data-state="3"] .brand-text { stroke: transparent; fill: var(--brand-cyan); }
        [data-state="3"] .logo-nodes circle { opacity: 0; }

        [data-state="4"] .stage-center { transform: rotateX(55deg) rotateZ(-30deg) scale(0.85) translateZ(40px); }
        [data-state="4"] .logo-layer:nth-child(1) .o-shape { fill: var(--brand-amber); stroke: transparent; }
        [data-state="4"] .logo-layer:nth-child(1) .t-shape { fill: var(--brand-cyan); stroke: transparent; }
        [data-state="4"] .logo-layer:nth-child(1) .pupil { fill: var(--brand-grey); stroke: transparent; }
        [data-state="4"] .logo-layer:nth-child(1) .brand-text { fill: var(--brand-cyan); stroke: transparent; }

        [data-state="4"] .logo-layer:nth-child(2) { transform: translateZ(-9px); }
        [data-state="4"] .logo-layer:nth-child(2) .o-shape { fill: #c4691c; stroke: transparent; }
        [data-state="4"] .logo-layer:nth-child(2) .t-shape { fill: #008a9c; stroke: transparent; }
        [data-state="4"] .logo-layer:nth-child(2) .pupil { fill: #3f3f3f; stroke: transparent; }
        [data-state="4"] .logo-layer:nth-child(2) .brand-text { fill: #008a9c; stroke: transparent; }

        [data-state="4"] .logo-layer:nth-child(3) { transform: translateZ(-18px); filter: drop-shadow(-20px 30px 20px rgba(0,0,0,0.15)); }
        [data-state="4"] .logo-layer:nth-child(3) .o-shape,
        [data-state="4"] .logo-layer:nth-child(3) .t-shape,
        [data-state="4"] .logo-layer:nth-child(3) .pupil,
        [data-state="4"] .logo-layer:nth-child(3) .brand-text { fill: #222; stroke: transparent; opacity: 0.4; }

        [data-state="5"] .print-stage { opacity: 1; visibility: visible; transform: scale(1); transition-delay: 0s, 0s, 0s; }
        [data-state="5"] .stage-center { transform: scale(0.55) translateY(-4%); opacity: 0; }

        /* ============ BRAND IDENTITY PRESENTATION BOARD ============ */
        .brand-board-wrapper { width: 100%; background: #e0e0e0; padding: clamp(30px, 5vw, 60px) clamp(10px, 2vw, 20px); display: flex; justify-content: center; position: relative; z-index: 10; }
        .brand-board { width: 100%; max-width: 1200px; background: #ffffff; box-shadow: 0 30px 80px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; }

        .brand-board .o-shape { fill: var(--brand-amber); }
        .brand-board .t-shape { fill: var(--brand-cyan); }
        .brand-board .pupil   { fill: var(--brand-grey); }
        .brand-board .brand-text { fill: var(--brand-cyan); font-family: var(--font-brand); font-weight: 700; letter-spacing: -1.5px; }

        .board-header { padding: clamp(40px, 6vw, 70px) 20px clamp(30px, 5vw, 60px); display: flex; justify-content: center; align-items: center; background: #ffffff; }
        .board-header svg { width: 100%; max-width: 320px; height: auto; }

        .board-variants { display: grid; grid-template-columns: repeat(3, 1fr); }
        .variant-box { padding: clamp(30px, 5vw, 60px) 20px; display: flex; justify-content: center; align-items: center; }
        .variant-box svg { width: 100%; max-width: 235px; height: auto; }

        .var-dark { background: var(--bg-dark-teal); }
        .brand-board .var-dark .o-shape, .brand-board .var-dark .t-shape, .brand-board .var-dark .pupil, .brand-board .var-dark .brand-text { fill: #ffffff; }
        .var-light { background: #ffffff; }
        .var-accent { background: var(--bg-dark-orange); }
        .brand-board .var-accent .o-shape, .brand-board .var-accent .t-shape, .brand-board .var-accent .pupil, .brand-board .var-accent .brand-text { fill: #ffffff; }

        .board-hero { position: relative; width: 100%; min-height: clamp(300px, 40vw, 460px); display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-hero); overflow: hidden; padding: 50px 20px; text-align: center; }
